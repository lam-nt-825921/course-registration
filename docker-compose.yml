version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: course_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: course_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d course_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: course_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:password@db:5432/course_db
    depends_on:
      db:
        condition: service_healthy
    # Mount source code để sửa code nhận ngay không cần build lại (Hot reload)
    volumes:
      - ./backend:/app
    # Cài đặt command chạy kèm lệnh sinh bảng tự động nếu chưa dùng alembic
    command: sh -c "uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
