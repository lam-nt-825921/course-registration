version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: vnu_user
      POSTGRES_PASSWORD: vnu_password
      POSTGRES_DB: course_registration
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
